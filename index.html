<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与 Red 互动 (Talking with Red)</title>
    
    <style>
        /* 网页整体背景设置 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #222; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 游戏主容器（严格限制为 3:4 比例） */
        #game-screen {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (3 / 4));
            max-height: calc(100vw * (4 / 3));
            
            /* 引入你的背景图片 - 请确保文件名为 Abc.jpg */
            background-image: url('Abc.jpg'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            
            cursor: pointer; 
            position: relative; /* 核心：允许内部元素（如 Red）进行绝对定位 */
            
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* --- 新增：Red 胖红图片的样式 --- */
        #red-bird-image {
            /* 1. 使用绝对定位，相对于 #game-screen */
            position: absolute;
            
            /* 2. 定位到草地中央（底部，水平居中） */
            bottom: 5%;        /* 距离底部 5% 的高度，就在草地上 */
            left: 50%;         /* 位于左侧 50% 处 */
            transform: translateX(-50%); /* 水平反向平移自身宽度的 50%，实现真正的中央对齐 */
            
            /* 3. 设置图片大小（调整为你觉得合适的尺寸，这里设为容器宽度的 25%） */
            width: 25%;
            height: auto;      /* 保持比例 */
            
            /* 4. 核心：初始状态为隐藏 */
            opacity: 0;         /* 初始透明度为 0（完全透明） */
            visibility: hidden; /* 防止点击到隐藏的图片 */
            
            /* 5. 添加淡入动画效果 */
            transition: opacity 0.5s ease-out; /* 透明度在 0.5 秒内平滑过渡 */
            
            /* 可选：防止图片被玩家拖拽 */
            pointer-events: none; 
        }

        /* 当给图片添加 .show 类时，它会显示出来 */
        #red-bird-image.show {
            opacity: 1;         /* 透明度变为 1（完全不透明） */
            visibility: visible; /* 变为可见 */
        }

    </style>
</head>
<body>

    <div id="game-screen">
        <img id="red-bird-image" src="red_bird.png" alt="Red Bird">
    </div>

    <script>
        // 1. 找到各个元素
        const gameScreen = document.getElementById('game-screen');
        const redBird = document.getElementById('red-bird-image');

        // 2. 游戏的点击逻辑
        gameScreen.addEventListener('click', function() {
            // 当点击屏幕时，给 Red 胖红图片添加 'show' 类
            // 这样 CSS 就会触发它的淡入效果
            redBird.classList.add('show');
            
            // 可选：你也可以在这里播放声音
            // let audio = new Audio('red-voice.mp3'); audio.play();
        });
    </script>

</body>
</html>
