<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与 Red 互动 (Talking with Red)</title>
    
    <style>
        /* 网页整体背景设置 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            /* 添加深色背景，用于填充 3:4 游戏画面之外的空白区域 */
            background-color: #222; 
            /* 使用 Flexbox 布局让游戏画面永远保持在屏幕正中央 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 游戏主容器（严格限制为 3:4 比例） */
        #game-screen {
            /* 核心计算：确保在任何设备上都不会超出边界，并完美保持 3:4 */
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (3 / 4));
            max-height: calc(100vw * (4 / 3));
            
            /* 引入你的背景图片 */
            background-image: url('Abc.jpg'); 
            /* 既然容器已经是 3:4 了，让图片 100% 填满容器即可 */
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            
            cursor: pointer; 
            position: relative; /* 方便以后在上面绝对定位放置 Red 的图片 */
            
            /* 可选：给游戏画面加一点阴影，让它看起来像一个独立的屏幕 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="game-screen">
        </div>

    <script>
        const gameScreen = document.getElementById('game-screen');

        gameScreen.addEventListener('click', function() {
            alert('成功触摸屏幕！背景比例现在是严格的 3:4 了。');
        });
    </script>

</body>
</html>
