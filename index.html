<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与 Red 互动 (Talking with Red)</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        #game-screen {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            background-image: url('Abc.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer; 
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #instruction-text {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        #red-bird-image {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            height: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-out, transform 0.2s ease-out;
            z-index: 5;
            pointer-events: none;
        }

        #red-bird-image.show {
            opacity: 1;
            visibility: visible;
        }

        #red-bird-image.listening {
            width: 55%;
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="instruction-text">Touch the Screen to start Talking with Red!</div>
        <img id="red-bird-image" src="red_bird.png" alt="Red Bird">
    </div>

    <script>
        const gameScreen = document.getElementById('game-screen');
        const redBird = document.getElementById('red-bird-image');
        const instructionText = document.getElementById('instruction-text');

        let isGameStarted = false;
        let recognition;

        // 初始化语音识别函数
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("您的浏览器不支持语音识别功能，请尝试使用 Chrome。");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onsoundstart = () => {
                console.log("检测到声音");
                redBird.src = 'IMG_2861.png';
                redBird.classList.add('listening');
            };

            recognition.onsoundend = () => {
                console.log("声音结束");
                setTimeout(() => {
                    redBird.src = 'red_bird.png';
                    redBird.classList.remove('listening');
                }, 1000);
            };

            recognition.onerror = (event) => {
                console.error("语音识别错误:", event.error);
                // 如果是权限问题，提醒用户
                if (event.error === 'not-allowed') {
                    alert("请允许麦克风权限以与 Red 互动。");
                }
            };

            recognition.onend = () => {
                if (isGameStarted) recognition.start();
            };

            recognition.start();
        }

        gameScreen.addEventListener('click', async function() {
            if (!isGameStarted) {
                try {
                    // 1. 显式请求麦克风权限
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // 2. 权限获取成功后，开始游戏逻辑
                    isGameStarted = true;
                    redBird.classList.add('show');
                    instructionText.style.opacity = '0';

                    // 3. 初始化语音识别
                    initSpeechRecognition();
                    
                    // 释放流（我们只需要权限，不需要直接处理音频流，SpeechRecognition 会自己处理）
                    stream.getTracks().forEach(track => track.stop());

                } catch (err) {
                    console.error("无法获取麦克风权限:", err);
                    alert("无法访问麦克风。请确保您已授予权限并正在使用 HTTPS 环境。");
                }
            }
        });
    </script>

</body>
</html>
