
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与 Red 互动 (Talking with Red)</title>
    
    <style>
        /* 网页整体背景设置 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #222; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        /* 游戏主容器（严格限制为 3:4 比例） */
        #game-screen {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (3 / 4));
            max-height: calc(100vw * (4 / 3));
            
            /* 引入背景图片 */
            background-image: url('Abc.jpg'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            
            cursor: pointer; 
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 提示文字样式 */
        #instruction-text {
            position: absolute;
            top: 12%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        /* Red 胖红图片的样式 */
        #red-bird-image {
            position: absolute;
            
            /* 调整位置：位于画面中央 */
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            
            /* 调整大小：放大到 60% */
            width: 45%;
            height: auto;
            
            /* 初始状态为隐藏 */
            opacity: 0;
            visibility: hidden;
            
            /* 添加淡入和缩放动画效果 */
            transition: opacity 0.5s ease-out, transform 0.2s ease-out;
            
            pointer-events: none; 
            z-index: 5;
        }

        /* 当显示时的状态 */
        #red-bird-image.show {
            opacity: 1;
            visibility: visible;
        }

        /* 点击时的缩放反馈 */
        #red-bird-image.active {
            transform: translateX(-50%) scale(1.1);
        }

    </style>
</head>
<body>

    <div id="game-screen">
        <div id="instruction-text">Touch the Screen to start Talking with Red!</div>
        <img id="red-bird-image" src="red_bird.png" alt="Red Bird">
    </div>

    <script>
        const gameScreen = document.getElementById('game-screen');
        const redBird = document.getElementById('red-bird-image');
        const instructionText = document.getElementById('instruction-text');

        gameScreen.addEventListener('click', function() {
            // 显示 Red
            redBird.classList.add('show');
            
            // 隐藏提示文字
            instructionText.style.opacity = '0';

            // 添加点击反馈动画
            redBird.classList.add('active');
            setTimeout(() => {
                redBird.classList.remove('active');
            }, 150);
        });
    </script>

</body>
</html>
