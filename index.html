<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与 Red 互动 (Talking with Red)</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; font-family: 'Arial', sans-serif; }
        
        /* 游戏主容器：调整为更窄的比例 (9:21) */
        #game-screen { 
            width: 100vw; 
            height: 100vh; 
            max-width: calc(100vh * (9 / 21)); /* 核心修改：从 9/16 改为 9/21，使其更窄 */
            max-height: calc(100vw * (21 / 9)); 
            background-image: url('Abc.jpg'); 
            background-size: cover; 
            background-position: center; 
            cursor: pointer; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
        }

        #instruction-text { position: absolute; top: 15%; width: 100%; text-align: center; color: white; font-size: 1.1rem; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); padding: 0 30px; box-sizing: border-box; z-index: 10; pointer-events: none; transition: opacity 0.5s ease-out; }
        
        #red-bird-image { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); width: 50%; height: auto; opacity: 0; visibility: hidden; transition: opacity 0.3s ease-out, transform 0.2s ease-out; z-index: 5; pointer-events: none; }
        #red-bird-image.show { opacity: 1; visibility: visible; }
        #red-bird-image.listening { width: 60%; }
        
        #status-debug { position: absolute; bottom: 5%; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.7rem; z-index: 20; }
    </style>
</head>
<body>
    <div id="game-screen">
        <div id="instruction-text">Touch the Screen to start Talking with Red!</div>
        <img id="red-bird-image" src="red_bird.png" alt="Red Bird">
        <div id="status-debug">等待点击开始...</div>
    </div>

    <script>
        const gameScreen = document.getElementById('game-screen');
        const redBird = document.getElementById('red-bird-image');
        const instructionText = document.getElementById('instruction-text');
        const statusDebug = document.getElementById('status-debug');

        let isGameStarted = false;
        let audioContext, analyser, microphone, javascriptNode;

        async function startVolumeDetection() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;

                microphone.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);

                javascriptNode.onaudioprocess = function() {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;
                    for (let i = 0; i < array.length; i++) {
                        values += array[i];
                    }
                    const average = values / array.length;

                    if (average > 15) {
                        redBird.src = 'IMG_2861.png';
                        redBird.classList.add('listening');
                    } else {
                        redBird.src = 'red_bird.png';
                        redBird.classList.remove('listening');
                    }
                };
                statusDebug.innerText = "正在监听声音...";
            } catch (err) {
                statusDebug.innerText = "无法访问麦克风";
            }
        }

        gameScreen.addEventListener('click', function() {
            if (!isGameStarted) {
                isGameStarted = true;
                redBird.classList.add('show');
                instructionText.style.opacity = '0';
                startVolumeDetection();
            }
        });
    </script>
</body>
</html>
