<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与 Red 互动 (Talking with Red)</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        #game-screen {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            background-image: url('Abc.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer; 
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #instruction-text {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        #red-bird-image {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            height: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-out, transform 0.2s ease-out;
            z-index: 5;
            pointer-events: none;
        }

        #red-bird-image.show {
            opacity: 1;
            visibility: visible;
        }

        /* 倾听时的微调：因为倾听图带手和耳朵，可能需要稍微调大一点或调整位置 */
        #red-bird-image.listening {
            width: 55%; /* 倾听时稍微放大，因为图片包含了手部 */
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="instruction-text">Touch the Screen to start Talking with Red!</div>
        <img id="red-bird-image" src="red_bird.png" alt="Red Bird">
    </div>

    <script>
        const gameScreen = document.getElementById('game-screen');
        const redBird = document.getElementById('red-bird-image');
        const instructionText = document.getElementById('instruction-text');

        let isGameStarted = false;

        // 初始化语音识别
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; // 持续监听
            recognition.interimResults = true; // 获取中间结果

            // 当检测到声音开始
            recognition.onsoundstart = () => {
                if (isGameStarted) {
                    redBird.src = 'IMG_2861.png'; // 切换到倾听图片
                    redBird.classList.add('listening');
                }
            };

            // 当声音结束或识别完成
            recognition.onsoundend = () => {
                if (isGameStarted) {
                    // 延迟一小会儿切回原图，效果更自然
                    setTimeout(() => {
                        redBird.src = 'red_bird.png';
                        redBird.classList.remove('listening');
                    }, 1000);
                }
            };
            
            // 容错处理：如果识别停止了，自动重新开始
            recognition.onend = () => {
                if (isGameStarted) recognition.start();
            };
        }

        gameScreen.addEventListener('click', function() {
            if (!isGameStarted) {
                isGameStarted = true;
                redBird.classList.add('show');
                instructionText.style.opacity = '0';

                // 启动语音识别
                if (recognition) {
                    recognition.start();
                } else {
                    alert("您的浏览器不支持语音识别功能，请尝试使用 Chrome。");
                }
            }
        });
    </script>

</body>
</html>
